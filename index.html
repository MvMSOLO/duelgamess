<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 2px solid #0f0;
            padding: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 10px #0f0;
        }
        h1 {
            font-size: 3em;
            text-shadow: 0 0 20px #0f0;
        }
        button {
            background-color: #0f0;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0e0;
            box-shadow: 0 0 10px #0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Duel Games</h1>
        <div>
            <input type="text" id="roomName" placeholder="Enter Room Name" />
            <button id="createRoom">Create Room</button>
        </div>
        <div>
            <input type="text" id="joinRoomName" placeholder="Enter Room Name to Join" />
            <button id="joinRoom">Join Room</button>
        </div>
        <p>Control your players with arrow keys and space bar!</p>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3000');

        document.getElementById('createRoom').onclick = () => {
            const roomName = document.getElementById('roomName').value;
            socket.emit('createRoom', roomName);
        };

        document.getElementById('joinRoom').onclick = () => {
            const roomName = document.getElementById('joinRoomName').value;
            socket.emit('joinRoom', roomName);
        };
    </script>
</body>
</html>
