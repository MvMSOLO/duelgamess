<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tank Duel - Game Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Neon Tank Duel</h1>
        <h2>Create or Join a Game Room</h2>
        <form id="gameRoomForm">
            <label for="roomName">Room Name:</label>
            <input type="text" id="roomName" name="roomName" required>
            <button type="submit">Create Room</button>
        </form>
        <div id="joinRoom">
            <h3>Or Join an Existing Room</h3>
            <input type="text" id="joinRoomName" placeholder="Enter Room Name" required>
            <button id="joinRoomButton">Join Room</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
