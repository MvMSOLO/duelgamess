<!DOCTYPE html>
<html>
<head>
    <title>Duel Games</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid black;
        }
        #scoreboard, #chat, #gameOver {
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
            width: 100%;
            max-width: 400px;
        }
        #gameOver {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="scoreboard">Score: <span id="score">0</span></div>
    <div id="chat">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button id="sendBtn">Send</button>
        <div id="chatLog"></div>
    </div>
    <div id="gameOver">
        <h2>Game Over</h2>
        <button id="replayBtn">Play Again</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        function startGame() {
            score = 0;
            isGameOver = false;
            document.getElementById('gameOver').style.display = 'none';
            gameInterval = setInterval(updateGame, 1000/60);
        }

        function updateGame() {
            if (isGameOver) return;
            // Game logic and rendering here
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'blue';
            ctx.fillRect(50, 50, 100, 100); // Example player
            ctx.fillStyle = 'black';
            ctx.fillText('Score: ' + score, 10, 20);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById('gameOver').style.display = 'block';
        }

        document.getElementById('sendBtn').addEventListener('click', function() {
            const input = document.getElementById('chatInput');
            const chatLog = document.getElementById('chatLog');
            chatLog.innerHTML += '<div>' + input.value + '</div>';
            input.value = '';
        });

        document.getElementById('replayBtn').addEventListener('click', startGame);

        window.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowUp') {
                // Move player up
            } else if (event.key === 'ArrowDown') {
                // Move player down
            }
        });

        startGame();
    </script>
</body>
</html>
